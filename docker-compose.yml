version: '3.8'

services:
  php:
    build: ./docker/php
    container_name: arujan-php
    volumes:
      - ./:/var/www
    ports:
      - "9000:9000"
      - "5173:5173"
    networks:
      - arujan_network

  queue-worker:
    build: ./docker/php
    container_name: arujan-queue-worker
    command: php artisan queue:work --tries=1 --timeout=900 --sleep=3
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - arujan_network

  nginx:
    image: nginx:1.21
    container_name: arujan-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - arujan_network

  mysql:
    image: mysql:8.0
    container_name: arujan-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: "password##"
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - arujan_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: arujan-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: laravel_user
      PMA_PASSWORD: "password##"
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - arujan_network

volumes:
  db-data:

networks:
  arujan_network: